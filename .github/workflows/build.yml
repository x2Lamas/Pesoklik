name: Build IPA
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen && xcodegen
      # Unsigned build; Sideloadly/AltStore re-sign it with your Apple ID on install.
      - run: |
          xcodebuild -project PejskoKlik.xcodeproj -scheme PejskoKlik \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PejskoKlik.app Payload/
          zip -qr PejskoKlik.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PejskoKlik-ipa
          path: PejskoKlik.ipa
